<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button group · Motion drawing</title>
<!-- Headless player for dimensional-drawing motion scenes.
     render.mjs injects: STAGE_W, STAGE_H, BG, the scene CSS and the scene JS.
     The scene API matches Claude Motion's kit: kit.scene(id, { init(kit), render(t) }). -->
<style>
  html, body { margin: 0; background: var(--bg, #fff); }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; --sans: Arimo, Helvetica, Arial, sans-serif; }
</style>
<style id="scene-css">:root{color-scheme:light;--paper:#ececec;--sheet:#fff;--ink:#111;--ink2:#444;--ink3:#7a7a7a;--fill:#f3f3f3;--fill2:#e6e6e6;--f:Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f)}
.wrap{max-width:1800px;margin:auto;padding:28px 28px 32px}
.tb{display:grid;grid-template-columns:2.3fr 1fr 1fr 1fr;border:1.2px solid var(--ink);border-radius:16px;background:var(--sheet);overflow:hidden;margin-bottom:20px}
.tb>div{min-width:0;padding:12px 16px;border-right:.8px solid var(--ink);border-bottom:.8px solid var(--ink)}
.tb>div:nth-child(4),.tb>div:nth-child(7){border-right:0}.tb .big{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.075em;color:var(--ink2)}
h1{font-size:44px;font-weight:400;letter-spacing:.1em;line-height:1.1;text-transform:uppercase;margin:8px 0 0}
.v{margin-top:6px;font-size:12px;line-height:1.5;letter-spacing:.05em;text-transform:uppercase}.scope{font-size:10.5px;line-height:1.6;max-width:460px}
.tb .notes{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:22px;border-right:0;font-size:10.5px;line-height:1.9;text-transform:uppercase;letter-spacing:.035em}
.notes strong{font-size:12px;letter-spacing:.06em}.notes strong span{font-size:10px;font-weight:400}.notes ol{padding-left:18px;margin:5px 0 0}
.tb .figs{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);padding:14px 16px;border:0}
.figs>div{padding-left:16px;border-left:.8px solid var(--ink)}.figs>div:first-child{padding-left:0;border-left:0}.figs .v{font-size:18px;text-transform:none;letter-spacing:0;white-space:nowrap}
.scroll{overflow-x:auto;background:var(--sheet);border-radius:16px}svg{display:block;width:100%;min-width:1100px;height:auto}
.foot{display:flex;justify-content:space-between;gap:20px;padding:12px 2px 0;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
/* drawing */
.u{font-family:var(--f);text-transform:uppercase;letter-spacing:.07em}
.border{fill:none;stroke:var(--ink);stroke-width:1.2}
.obj{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.well{fill:var(--fill);stroke:var(--ink);stroke-width:1}
.slot{fill:none;stroke:var(--ink2);stroke-width:.8;stroke-dasharray:4 3}
.hug{fill:var(--fill2);stroke:var(--ink);stroke-width:1}
.thin{fill:none;stroke:var(--ink);stroke-width:.8}
.ph{fill:none;stroke:var(--ink3);stroke-width:.8;stroke-dasharray:14 3 3 3}
.cl{fill:none;stroke:var(--ink3);stroke-width:.7;stroke-dasharray:16 3 2 3}
.cut{stroke:var(--ink);stroke-width:2}
.dl{stroke:var(--ink);stroke-width:.7;fill:none}
.ext{stroke:var(--ink);stroke-width:.55;fill:none}
.arrow{fill:var(--ink)}
.hl{stroke:var(--ink2);stroke-width:.7}
.hs{stroke:var(--ink);stroke-width:.8}
.env{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:10 3 2 3}
.dt{font:400 11px var(--f);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.dts{font:400 9.5px var(--f);fill:var(--ink2);letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.sl{font:400 9px var(--f);fill:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.nt{font:400 11.5px var(--f);fill:var(--ink);letter-spacing:.06em;text-transform:uppercase}
.nth{font:700 13px var(--f);fill:var(--ink);letter-spacing:.06em}
.vt{font:400 12px var(--f);fill:var(--ink);letter-spacing:.1em;text-transform:uppercase}
.vtb{font:400 20px var(--f);fill:var(--ink);letter-spacing:.06em}
.nb{fill:var(--sheet);stroke:var(--ink);stroke-width:.9}
.nbt{font:400 9.5px var(--f);fill:var(--ink)}
.lead{stroke:var(--ink);stroke-width:.7;fill:none}
.dot{fill:var(--ink)}
.th{font:400 10.5px var(--f);fill:var(--ink);letter-spacing:.05em;text-transform:uppercase}
.tc{font:400 10.5px var(--f);fill:var(--ink)}
.tbk{font:400 7px var(--f);fill:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.tbt{font:700 15px var(--f);fill:var(--ink)}
.tbv{font:400 17px var(--f);fill:var(--ink);letter-spacing:.06em}


.tc{font-size:10px}.nt{font-size:10.5px;letter-spacing:.035em}.source{font:400 10px var(--f);fill:var(--ink2)}
.accent-free{fill:#555;stroke:var(--ink);stroke-width:1}.faint{fill:#fafafa;stroke:#aaa;stroke-width:.55}
.rule{stroke:#ccc;stroke-width:.55}.white-label{font:400 9px var(--f);fill:#fff;letter-spacing:.08em}

#stage {overflow:hidden} .dw-cam{position:absolute;left:0;top:0;width:1900px;height:1060px;transform-origin:0 0}.dw-cam svg{width:1700px;min-width:1700px;height:1060px;overflow:visible} .dw-cam text{text-transform:uppercase}</style>
</head>
<body>
<div id="stage"></div>
<script>
  const cfg = window.__CFG__ || { w: 1920, h: 1080, bg: '#ffffff' };
  const stage = document.getElementById('stage');
  stage.style.width = cfg.w + 'px';
  stage.style.height = cfg.h + 'px';
  stage.style.background = cfg.bg;
  document.documentElement.style.setProperty('--bg', cfg.bg);

  // Minimal kit shim (same helpers the scenes use in Claude Motion).
  var SCENES = {};
  var kit = (function () {
    const clamp01 = x => Math.max(0, Math.min(1, x));
    const seg = (t, a, b) => clamp01((t - a) / (b - a));
    const lerp = (a, b, p) => a + (b - a) * p;
    const eo = x => 1 - Math.pow(1 - x, 3);
    const ei = x => x * x * x;
    const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    return {
      seg, lerp, eo, ei, eio, clamp01, stage,
      width: cfg.w, height: cfg.h,
      h: s => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstElementChild; },
      css: s => { const st = document.createElement('style'); st.textContent = s; stage.appendChild(st); },
      scene: (id, o) => { SCENES[id] = o; },
    };
  })();
</script>
