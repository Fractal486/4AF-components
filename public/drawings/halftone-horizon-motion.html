<body>
<div id="stage"></div>
<script>
  const cfg = window.__CFG__ || { w: 1920, h: 1080, bg: '#ffffff' };
  const stage = document.getElementById('stage');
  stage.style.width = cfg.w + 'px';
  stage.style.height = cfg.h + 'px';
  stage.style.background = cfg.bg;
  document.documentElement.style.setProperty('--bg', cfg.bg);

  // Minimal kit shim (same helpers the scenes use in Claude Motion).
  var SCENES = {};
  var kit = (function () {
    const clamp01 = x => Math.max(0, Math.min(1, x));
    const seg = (t, a, b) => clamp01((t - a) / (b - a));
    const lerp = (a, b, p) => a + (b - a) * p;
    const eo = x => 1 - Math.pow(1 - x, 3);
    const ei = x => x * x * x;
    const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    return {
      seg, lerp, eo, ei, eio, clamp01, stage,
      width: cfg.w, height: cfg.h,
      h: s => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstElementChild; },
      css: s => { const st = document.createElement('style'); st.textContent = s; stage.appendChild(st); },
      scene: (id, o) => { SCENES[id] = o; },
    };
  })();
</script>

},
  render(t) {
    t = t / 0.85;
    let i = 0; while (i < DW_CAM.length - 2 && t > DW_CAM[i + 1].t) i++;
    const c0 = DW_CAM[i], c1 = DW_CAM[i + 1], p = eio(seg(t, c0.t, c1.t));
    const z = Math.exp(lerp(Math.log(c0.z), Math.log(c1.z), p)), cx = lerp(c0.cx, c1.cx, p), cy = lerp(c0.cy, c1.cy, p);
    this.cam.transform = 'translate(' + (960 - cx * z) + 'px,' + (540 - cy * z) + 'px) scale(' + z + ')';
    for (const it of this.reg) {
      let v = clamp01((t - it.a) / (it.b - it.a)); v = Math.round(v * 400) / 400;
      if (v === it.last) continue; it.last = v; const s = it.e.style;
      if (it.k === 'f') { s.opacity = eo(v); continue; }
      const e = eio(v); s.opacity = Math.min(1, v * 6);
      if (v >= 1) { s.strokeDasharray = ''; s.strokeDashoffset = ''; } else { s.strokeDasharray = '1 2'; s.strokeDashoffset = 1 - e; }
      s.fillOpacity = eo(seg(v, .55, 1));
    }

    this.wipe.setAttribute('height', 335 * eio(seg(t,2.35,4.1)));
    this.plan.style.opacity = 1 - eio(seg(t,4.55,5.25)) + eio(seg(t,7.8,9.25));
    // Invert each final axonometric basis back to the field-plan rectangle,
    // then interpolate to identity so the hold matches the printed sheet.
    this.layers.forEach((layer,index)=>{
      const y=[419,352,285][index];
      const det=254*54+69*34;
      const a=710*54/det, b=-335*34/det, c=710*69/det, d=335*254/det;
      const flat=[a,b,c,d,490-a*148-c*y,145-b*148-d*y];
      const u=eio(seg(t,4.45+index*.12,6.35+index*.12));
      const matrix=flat.map((v,i)=>lerp(v,[1,0,0,1,0,0][i],u));
      layer.setAttribute('transform','matrix('+matrix.join(' ')+')');
      layer.style.fillOpacity=eo(seg(t,4.45+index*.12+.55,4.45+index*.12+1.25));
      layer.setAttribute('vector-effect','non-scaling-stroke');
    });
  },
});
</script>
