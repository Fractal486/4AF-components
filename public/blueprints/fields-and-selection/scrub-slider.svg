<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" fill="none" role="img" aria-labelledby="ss-title ss-desc">
  <title id="ss-title">Scrub Slider spacing blueprint</title>
  <desc id="ss-desc">Default medium card slider, showing Width at 307 pixels during a drag. Drawn at three times size: chosen width 280 pixels, fixed height 60 pixels, side insets 16 pixels, ruler height 16 pixels, bottom inset 6 pixels, ticks spaced 6 pixels, and 20 pixel step buttons.</desc>
  <!-- Sources: registry.json; registry/ui/scrub-slider/scrub-slider.tsx;
       registry/ui/scrub-slider/scrub-slider.variants.ts;
       registry/ui/scrub-slider/scrub-slider-geometry.ts;
       inspector/entries/scrub-slider.tsx; app/globals.css;
       node_modules/tailwindcss/theme.css; lib/component-catalog.ts.
       Default layout=card, variant=card, size=md, chevrons=true.
       Demo quantity Width: min=0, max=2000, step=1, value=307.
       Active dragging state, not edge-scrolling; indicator chosen at ruler midpoint.
       Flexible w-full width is chosen as 280 CSS px, not a universal or maximum width.
       Scale=3. Root (180,180)-(1020,360): 280*3 by 60*3, radius 14*3.
       Card has no CSS border; the thin illustration contour denotes its boundary.
       Spacing unit .25rem=4px at 16px root. h-15=60px, px-4=16px.
       Content center: 60/2 - 9 = 21px; 20px line box starts at 11px.
       Label and unit: text-sm=13px; numeric value=15px, leading-5=20px.
       Glyph widths depend on installed sans font; only fixed boxes are dimensioned.
       Ruler width: 280-2*16=248px. h-4=16px, bottom-1.5=6px.
       Ruler top: 60-6-16=38px. Ruler baseline y=342, top y=294.
       Tick spacing 6px, widths 1px, base heights 4/6/8px, cosine lens radius
       5 ticks and peak 10px. Value 307 is centered; view=307-248/12.
       Indicator is 2px wide and 16px tall. Edge fade is 32px on each side.
       Steppers: 20px square, icon viewport 14px, 4px gap to the value.
       Number-to-unit gap is 2px. Active drag dims steppers to .25.
       Dark background oklch(.100 0 0) rounds to sRGB #030303.
       Sidebar category: Fields and selection.
       Intro: ticks scroll left by 108 SVG units (36 CSS px, six tick intervals)
       from 250 to 650ms within the fixed edge mask; annotations reveal at 700ms.
       Extra left ticks cover the entering edge. Reduced motion shows the final state. -->
  <defs>
    <style>
      #ss-blueprint text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .ss-label { fill: #6889ff; font-size: 18px; }
      .ss-measure { stroke: #6889ff; stroke-width: 1.5; }
      .ss-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      @keyframes ss-draw-line { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes ss-reveal { from { opacity: 0; } }
      @keyframes ss-scroll-ruler { from { transform: translateX(108px); } to { transform: translateX(0); } }
      @media (prefers-reduced-motion: no-preference) {
        .ss-scroll { animation: ss-scroll-ruler 400ms cubic-bezier(.22, 1, .36, 1) 250ms both; }
        .ss-draw { stroke-dasharray: 1; animation: ss-draw-line 200ms ease-out var(--ss-delay, 0ms) both; }
        .ss-outline { animation-duration: 400ms; }
        .ss-measure, .ss-spacing, .ss-label { animation: ss-reveal 200ms ease-out 700ms both; }
      }
    </style>
    <linearGradient id="ss-edge-fade">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.129032" stop-color="white"/>
      <stop offset="0.870968" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="ss-tick-mask" maskUnits="userSpaceOnUse" x="228" y="294" width="744" height="48">
      <rect x="228" y="294" width="744" height="48" fill="url(#ss-edge-fade)"/>
    </mask>
  </defs>
