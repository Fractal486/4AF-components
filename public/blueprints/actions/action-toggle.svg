<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="action-toggle-bp-title action-toggle-bp-description" class="action-toggle-bp">
  <title id="action-toggle-bp-title">Action Toggle spacing</title>
  <desc id="action-toggle-bp-description">The Plus icon morphs into the pending spinner while Follow stays fixed. An outlined medium Action Toggle while its follow action is pending, drawn at three times actual size. A twelve-bar spinner replaces the icon while the Follow label remains. The control is 34 CSS pixels tall with 14 pixel horizontal padding, a 16 pixel loader slot, a 10 pixel loader-to-label gap, and a 20 pixel label line box inset 7 pixels vertically. Its content-dependent width still reserves the widest label.</desc>
  <!--
    Native icon swap: morph.tsx opacity 0, scale .25, blur 4 CSS px (12 units),
    spring.clean (visualDuration .18, bounce 0), sampled every 10ms, 250..550ms.
    Follow has no pending override, so only Plus swaps into the spinner.
    Outgoing content is hidden for static and reduced-motion viewers.
    Sources:
      registry.json: action-toggle and its toggle / morph dependencies.
      registry/ui/action-toggle/action-toggle.tsx: outline, md, widest defaults;
        the wrapper inherits Toggle's gap; no data-icon-start is added, so there
        is no Button-only optical padding adjustment.
      registry/ui/toggle/toggle.tsx: shared buttonVariants, rectangular default.
      registry/ui/button/button.variants.ts: h-[34px], px-3.5, gap-2.5,
        rounded-[8px], text-sm, and SVG size-4. Outline uses a shadow, not a border.
      registry/ui/morph/morph.tsx: each slot reserves its widest supplied state.
      registry/lib/loader.tsx: LoadingIndicator falls back to ClassicLoader;
        the loader's maximum dimensions are constrained to its 16px slot.
      registry/ui/classic-loader/classic-loader.tsx and classic-loader.variants.ts:
        twelve 24-by-8 capsules, rotated every 30 degrees around (50,50) in a
        100-unit viewBox.
      public/blueprints/overlays-and-menus/dropdown-menu.svg: reuse the existing
        filled spinner geometry, illustration ink, and static opacity trail.
      inspector/entries/action-toggle.tsx and action-toggle.demo.tsx:
        Follow / Following / Try again labels; Plus / Check icons.
      node_modules/tailwindcss/theme.css: 0.25rem spacing; 16px root assumed.
      app/globals.css: text-sm = 13px, line-height 1.5385 (approximately 20px);
        dark background oklch(0.120 0 0) = approximately #060606.
      lib/component-catalog.ts COMPONENT_CATEGORIES: Actions.

    State: pending, pressed=false; outline / md / rectangular / sizing="widest".
      The default spinner replaces Plus. Without labels.pending, Follow remains.
    Scale: 3 SVG units per CSS pixel, including text and icon geometry.
    Button layout box: (315,219) to (645,321), 110 x 34 CSS pixels.
      Width is content-dependent, NOT a component token or maximum. This drawing
      uses a representative 56px widest label slot for the illustration font:
      14 + 16 + 10 + 56 + 14 = 110px. Production Geist metrics may change width.
      Follow uses a representative 37.33px advance, centered in the reserved
      56px label slot. No width API is implied.
    Content: (357,240) to (603,300), 82 x 20 CSS pixels.
      Horizontal padding = 3.5 * 4 = 14px each; inherited gap = 2.5 * 4 = 10px.
      Label line box = 13 * 1.5385, rounded to 20px; vertical inset = (34-20)/2 = 7px.
      Icon = 4 * 4 = 16px square; vertical inset = (34-16)/2 = 9px.
      Spinner uses the source's 100-unit geometry scaled by .48 to a 48-unit box.
      Its capsules are x=73, y=46, width=24, height=8, rx=4, as in the dropdown.
      The existing opacity trail rotates clockwise at the user's request.
    The 1px shadow ring is outside the layout box: its SVG centerline is offset
      outward by 1.5 units, with a 3-unit stroke. It consumes no padding or height.
    Illustration inks simplify the surface; the spinner conveys pending work.

    Animation: outline 0-400ms; annotations 700-900ms. Spinner fills stay visible.
      Spinner rotates once from 0-900ms, easing down to rest, then holds its final orientation.
      Static / reduced-motion rendering is fully visible with a stationary spinner.
  -->
  <defs>
    <style>
      .action-toggle-bp text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .action-toggle-bp-label { fill: #92948d; font-size: 18px; }
      .action-toggle-bp-content { fill: #c7c7c2; font-size: 39px; font-weight: 500; }
      .action-toggle-bp-measure { stroke: #6889ff; stroke-width: 1.5; }
      .action-toggle-bp-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      .action-toggle-bp-spinner { transform-box: fill-box; transform-origin: center; }
      @keyframes action-toggle-bp-draw {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes action-toggle-bp-reveal {
        from { opacity: 0; }
      }
      @keyframes action-toggle-bp-spin {
        from { transform: rotate(0turn); }
        to { transform: rotate(1turn); }
      }
      /* One press/release during reveal, matching Button's .95 press scale.
         spring.press: stiffness 500, damping 30, mass .6; sampled every 10ms.
         Runs 150..650ms, before measurements appear at 700ms. Separate groups
         compose with content/panel motion; static and reduced motion stay at 1. */
