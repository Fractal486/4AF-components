  <rect width="960" height="540" fill="#060606"/>

  <!-- Fills remain visible while the solid outline draws. -->
  <g class="action-toggle-bp-button-press" style="transform-origin: 480px 270px">
    <rect x="315" y="219" width="330" height="102" rx="24" fill="#353632"/>
    <rect x="313.5" y="217.5" width="333" height="105" rx="25.5" stroke="#a7a8a2" stroke-width="3" pathLength="1" class="action-toggle-bp-draw action-toggle-bp-outline"/>

    <!-- Actual padding boundaries, content line box, icon box, and gap edges.
         Guides sit over the fill and behind the visible label and spinner. -->
    <path d="M357 219V321 M603 219V321 M357 240H603 M357 300H603 M405 240V300 M435 240V300 M357 246H405 M357 294H405" class="action-toggle-bp-spacing"/>

    <text x="519" y="283" text-anchor="middle" textLength="112" lengthAdjust="spacingAndGlyphs" class="action-toggle-bp-content">Follow</text>
    <g class="at-old at-icon-morph" aria-hidden="true">
      <path d="M367 270H395 M381 256V284" stroke="#92948d" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g class="at-new at-icon-morph">
      <g transform="translate(357 246) scale(.48)" fill="#92948d">
      <g class="action-toggle-bp-spinner">
      <rect x="73" y="46" width="24" height="8" rx="4" opacity="1"/>
      <rect x="73" y="46" width="24" height="8" rx="4" transform="rotate(30 50 50)" opacity=".92"/>
      <rect x="73" y="46" width="24" height="8" rx="4" transform="rotate(60 50 50)" opacity=".84"/>
