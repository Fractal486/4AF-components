        53.3333% { opacity: 0.946164; transform: scale(0.959623); filter: blur(0.646033px); }
        56.6667% { opacity: 0.957682; transform: scale(0.968261); filter: blur(0.507821px); }
        60.0000% { opacity: 0.966815; transform: scale(0.975111); filter: blur(0.398223px); }
        63.3333% { opacity: 0.974033; transform: scale(0.980525); filter: blur(0.311598px); }
