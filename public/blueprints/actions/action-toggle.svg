        46.6667% { opacity: 0.086413; transform: scale(0.314810); filter: blur(10.963041px); }
        50.0000% { opacity: 0.068307; transform: scale(0.301230); filter: blur(11.180313px); }
        53.3333% { opacity: 0.053836; transform: scale(0.290377); filter: blur(11.353967px); }
        56.6667% { opacity: 0.042318; transform: scale(0.281739); filter: blur(11.492179px); }
