<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" fill="none" role="img" aria-labelledby="hover-card-bp-title hover-card-bp-description">
  <title id="hover-card-bp-title">Hover Card spacing blueprint</title>
  <desc id="hover-card-bp-description">Alex Morgan's profile preview, centered 6 pixels below its link and drawn at three times CSS size. The card enters once with a fade, scale, blur, and slide from the link. The default card is 288 pixels wide with a 1 pixel border and 16 pixel padding. A 40 pixel avatar sits 12 pixels from the copy. Text uses 20 pixel line boxes separated by 4 pixels between paragraphs. With the pictured two-line biography, the content-dependent card height is 122 pixels.</desc>
  <!--
    Sources:
      registry.json: hover-card lists registry/ui/hover-card/hover-card.tsx only;
        there is no sibling variants file.
      registry/ui/hover-card/hover-card.tsx: w-72, viewport cap 100vw - 2rem,
        rounded-md, border (1px), p-4, text-sm; bottom / center, sideOffset=6.
      inspector/entries/hover-card.tsx: @alexmorgan link; flex gap-3;
        size-10 avatar, min-w-0 copy with space-y-1; name, handle, biography.
      app/globals.css: text-sm=13px, line-height=1.5385 (nominally 20px),
        radius-md=7px; dark background=oklch(.120 0 0), approximately #060606.
      node_modules/tailwindcss/theme.css: spacing=.25rem=4px.
      node_modules/tailwindcss/preflight.css: border-box sizing.

    State: default open, loaded profile demo, bottom / center, no collision flip.
    Scale: 3 SVG units per CSS pixel, including all component typography.
    Viewport assumed at least 320px, so the viewport cap does not reduce w-72.
    Width: 72 * 4 = 288px. Interior: 288 - 2 * 1 - 2 * 16 = 254px.
    Copy width: 254 - 40 - 12 = 202px. Biography shown with two representative
      lines in the required portable illustration font, rather than downloaded Geist.
      Wrapping and height depend on caller content and the viewer's available font.
    Copy height: 20 + 4 + 20 + 4 + 2 * 20 = 88px.
    Card height for this content: 1 + 16 + max(40, 88) + 16 + 1 = 122px.
    Outer box: x=228..1092, y=290..656. Border inner edges: x=231..1089,
      y=293..653. Content: x=279..1041, y=341..605.
    Avatar: x=279..399, y=341..461. Copy: x=435..1041.
    Trigger: representative intrinsic-width link, centered at x=660; inherited
      20px line box at y=212..272. No button box, arrow, or focus ring is added.
    Placement gap: (290 - 272) / 3 = 6px, between layout boxes.
    Panel outline occupies its real 1px border; the avatar perimeter is illustration
      ink inset into its filled box and does not add a CSS border to the avatar.
    Animation: panel stroke 0..400ms; avatar 250..450ms; underline 400..600ms;
      annotations 700..900ms. Native popup enter runs 250..400ms, matching
      hover-card.tsx's bottom-side starting pose: opacity 0, scale .95,
      blur 4px, translateY -8px; at 3x these become blur 12 and translateY -24.
      Origin is the top edge nearest the centered trigger, (660, 290).
      app/globals.css: duration-fast=150ms, ease-out=cubic-bezier(.16,1,.3,1).
      Reduced-motion and static exports show all strokes and final guide opacities.
  -->
  <defs>
    <style>
      #hover-card-bp-root text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      #hover-card-bp-root .hover-card-bp-copy { fill: #92948d; font-size: 39px; }
      #hover-card-bp-root .hover-card-bp-emphasis { fill: #c7c7c2; font-weight: 600; }
      #hover-card-bp-root .hover-card-bp-trigger { fill: #c7c7c2; font-size: 39px; font-weight: 500; }
      #hover-card-bp-root .hover-card-bp-label { fill: #a1a29c; font-size: 18px; }
      #hover-card-bp-root .hover-card-bp-measure { stroke: #6889ff; stroke-width: 1.5; }
      #hover-card-bp-root .hover-card-bp-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      #hover-card-bp-root { --hover-card-bp-detail-duration: 200ms; --hover-card-bp-annotation-delay: 700ms; }
      @keyframes hover-card-bp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes hover-card-bp-reveal { from { opacity: 0; } }
      #hover-card-bp-root .hover-card-bp-enter { transform-origin: 660px 290px; }
      @keyframes hover-card-bp-enter {
        from { opacity: 0; transform: translateY(-24px) scale(.95); filter: blur(12px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
      }
      @media (prefers-reduced-motion: no-preference) {
        #hover-card-bp-root .hover-card-bp-enter {
          animation: hover-card-bp-enter 150ms cubic-bezier(.16,1,.3,1) 250ms both;
        }
        #hover-card-bp-root .hover-card-bp-draw {
          stroke-dasharray: 1;
          animation: hover-card-bp-draw var(--hover-card-bp-detail-duration) ease-out var(--hover-card-bp-line-delay, 0ms) both;
        }
        #hover-card-bp-root .hover-card-bp-outline { animation-duration: 400ms; }
        #hover-card-bp-root .hover-card-bp-measure,
        #hover-card-bp-root .hover-card-bp-spacing,
        #hover-card-bp-root .hover-card-bp-label {
          animation: hover-card-bp-reveal 200ms ease-out var(--hover-card-bp-annotation-delay) both;
        }
      }
    </style>
  </defs>
  <g id="hover-card-bp-root">
    <rect width="1320" height="850" fill="#060606"/>

    <!-- The link stays fixed while the popup enters from its anchor edge. -->
    <path d="M540 266H780" stroke="#a7a8a2" stroke-width="2.5" opacity=".7" pathLength="1" class="hover-card-bp-draw" style="--hover-card-bp-line-delay:400ms"/>
    <text x="660" y="254" text-anchor="middle" class="hover-card-bp-trigger">@alexmorgan</text>

    <g class="hover-card-bp-enter">
      <rect x="228" y="290" width="864" height="366" rx="21" fill="#111111"/>
      <rect x="229.5" y="291.5" width="861" height="363" rx="19.5" stroke="#a7a8a2" stroke-width="3" pathLength="1" class="hover-card-bp-draw hover-card-bp-outline"/>
      <circle cx="339" cy="401" r="60" fill="#353632"/>
      <circle cx="339" cy="401" r="58.75" stroke="#a7a8a2" stroke-width="2.5" pathLength="1" class="hover-card-bp-draw" style="--hover-card-bp-line-delay:250ms"/>

      <!-- Actual content inset and copy line boxes, over fills and behind text. -->
      <rect x="279" y="341" width="762" height="264" class="hover-card-bp-spacing"/>
      <path d="M399 341V605 M435 341V605" class="hover-card-bp-spacing"/>
      <path d="M435 401H1041 M435 413H1041 M435 473H1041 M435 485H1041 M435 545H1041" class="hover-card-bp-spacing"/>

      <text x="339" y="415" text-anchor="middle" class="hover-card-bp-copy hover-card-bp-emphasis">AM</text>
      <text x="435" y="383" class="hover-card-bp-copy hover-card-bp-emphasis">Alex Morgan</text>
      <text x="435" y="455" class="hover-card-bp-copy">@alexmorgan</text>
      <text x="435" y="527" class="hover-card-bp-copy">Product designer working on</text>
      <text x="435" y="587" class="hover-card-bp-copy">thoughtful, accessible interfaces.</text>
    </g>

    <!-- Overall default width; rulers touch the exact outer layout edges. -->
    <path d="M228 156V280 M1092 156V280" class="hover-card-bp-spacing"/>
    <path d="M228 133V155 M1092 133V155 M228 144H1092" class="hover-card-bp-measure"/>
    <text x="660" y="127" text-anchor="middle" class="hover-card-bp-label">288 px</text>

    <!-- Content-dependent total height for the pictured two-line biography. -->
    <path d="M182 290H218 M182 656H218" class="hover-card-bp-spacing"/>
    <path d="M160 290H182 M160 656H182 M171 290V656" class="hover-card-bp-measure"/>
    <text x="148" y="479" text-anchor="end" class="hover-card-bp-label">122 px</text>

    <!-- Gap from the trigger's line box, not from its underline ink. -->
    <path d="M792 272H861" class="hover-card-bp-spacing"/>
    <path d="M839 272H861 M839 290H861 M850 272V290" class="hover-card-bp-measure"/>
    <text x="882" y="287" class="hover-card-bp-label">6 px</text>

    <!-- Top padding excludes the border. Next segment is one 20px line box. -->
    <path d="M1089 293H1123 M1041 341H1123 M1041 401H1123 M1041 413H1123" class="hover-card-bp-spacing"/>
    <path d="M1123 293H1145 M1123 341H1145 M1134 293V341" class="hover-card-bp-measure"/>
    <text x="1156" y="323" class="hover-card-bp-label">16 px</text>
    <path d="M1123 401H1145 M1134 341V401" class="hover-card-bp-measure"/>
    <text x="1156" y="377" class="hover-card-bp-label">20 px</text>

    <!-- Paragraph spacing: (413 - 401) / 3 = 4px; leader meets midpoint. -->
    <path d="M1123 413H1145 M1134 401V413 M1134 407 1168 433H1190" class="hover-card-bp-measure"/>
    <text x="1204" y="439" class="hover-card-bp-label">4 px</text>

    <!-- Shared horizontal ruler: 16px padding, 40px avatar, 12px column gap. -->
    <path d="M231 653V691 M279 605V691 M399 605V691 M435 605V691" class="hover-card-bp-spacing"/>
    <path d="M231 691V713 M279 691V713 M399 691V713 M435 691V713 M231 702H435" class="hover-card-bp-measure"/>
    <text x="255" y="738" text-anchor="middle" class="hover-card-bp-label">16 px</text>
    <text x="339" y="738" text-anchor="middle" class="hover-card-bp-label">40 px</text>
    <text x="417" y="738" text-anchor="middle" class="hover-card-bp-label">12 px</text>
  </g>
</svg>
