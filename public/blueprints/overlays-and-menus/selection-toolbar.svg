<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" fill="none" role="img" aria-labelledby="stb-title stb-desc">
  <title id="stb-title">Selection Toolbar spacing blueprint</title>
  <desc id="stb-desc">The text range becomes selected before the toolbar rises into place above it. An open selection toolbar centered eight pixels above selected text. The bar is 32 pixels high, with four pixels of padding, 24 pixel actions, two pixel gaps, and 14 pixel icons. Copy, Highlight, three highlighter choices, and Clear reproduce the default demo composition. The first highlighter is selected and Clear is disabled. Drawn at three times CSS size.</desc>
  <!--
    Sources:
      registry.json: selection-toolbar and its complete implementation file list.
      registry/ui/selection-toolbar/selection-toolbar.tsx: top / center / sideOffset=8.
      registry/ui/selection-toolbar/selection-toolbar.variants.ts: p-1, gap-0.5,
        h-6, px-2.5, icon-only size-6, shell radius 8px.
      registry/ui/selection-toolbar/selection-toolbar.controls.tsx: group gap-0.5;
        separators mx-0.5 h-4 w-px; default ghost/sm actions.
      registry/ui/button/button.variants.ts: sm text-xs, gap-2, 14px SVGs,
        6px action corners. Button iconEdges detects the direct Clear icon;
        ActionButton/ActionToggle wrap their content, retaining 10px side padding.
      inspector/entries/selection-toolbar.tsx: labels=true, amber selected,
        unhighlighted selection, no saved highlights, Clear disabled.
      app/globals.css: text-xs=12px / approximately 16px line height;
        demo text-sm=13px / approximately 20px line height;
        dark background oklch(0.120 0 0) = approximately #060606.
      node_modules/tailwindcss/theme.css: spacing token=0.25rem (4px at 16px root).
      node_modules/tailwindcss/preflight.css: border-box sizing.

    All component geometry and text are drawn at 3x. Measurement labels are CSS px.
    Open, settled default ghost/sm state; icon-only tone controls use icon-sm.
    The popup is content-sized, not universally 334px wide. Representative label
    advances are 28px for Copy/Clear and 50px for Highlight in this sans-serif
    illustration; production width varies with font metrics. These advances are
    explicitly retained with textLength, with no change to measured padding/gaps.
    Copy = 10 + 14 + 8 + 28 + 10 = 70px.
    Highlight = 10 + 14 + 8 + 50 + 10 = 92px.
    Clear = 8 + 14 + 8 + 28 + 10 = 68px (leading-icon optical inset).
    Tone group = 3*24 + 2*2 = 76px.
    Each separator footprint = 2 + 1 + 2 = 5px; separator itself is 16px high.
    Width = 2*4 + 70 + 5 + 92 + 76 + 5 + 68 + 5*2 = 334px.
    Height = 4 + 24 + 4 = 32px; no layout border (the source uses a shadow).
    Toolbar box: x=199..1201, y=268..364. Action row: y=280..352.
    Selection: representative 130x20px text range, x=505..895, y=388..448;
      its center matches the toolbar; vertical offset = (388-364)/3 = 8px.
    Copy icon box x=241..283; label line box x=307..391, y=292..340.
    Illustrative solid outline is inset 1.5 units, so its outside matches the box.
    Solid stroke timing: shell 0..400ms; details 250..650ms;
      annotations 700..900ms. Static and reduced-motion states are fully visible.
  -->
  <defs>
    <style>
      #stb-drawing text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      #stb-drawing .stb-action { fill: #92948d; font-size: 36px; font-weight: 500; }
      #stb-drawing .stb-label { fill: #a1a29c; font-size: 18px; }
      #stb-drawing .stb-ink { stroke: #a7a8a2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      #stb-drawing .stb-measure { stroke: #6889ff; stroke-width: 1.5; }
      #stb-drawing .stb-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      @keyframes stb-draw-line { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes stb-reveal { from { opacity: 0; } }
      /* Selection sweeps across the existing range at 0..250ms.
         Source entry pose: scale .95, translateY 6 CSS px, blur 4 CSS px.
         At 3x those are 18 and 12 units; origin is the popup's bottom center.
         Popup 250..650ms, guides 700..900ms; reduced motion shows the final state. */
      #stb-drawing .stb-popup { transform-origin: 700px 364px; }
      @keyframes stb-select { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes stb-popup { from { opacity: 0; transform: translateY(18px) scale(.95); filter: blur(12px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); } }
      /* One press/release during reveal, matching Button's .95 press scale.
         spring.press: stiffness 500, damping 30, mass .6; sampled every 10ms.
         Runs 150..650ms, before measurements appear at 700ms. Separate groups
         compose with content/panel motion; static and reduced motion stay at 1. */
      @keyframes selection-toolbar-bp-button-press {
        0% { transform: scale(1.000000); }
        2% { transform: scale(0.998236); }
        4% { transform: scale(0.994025); }
        6% { transform: scale(0.988604); }
        8% { transform: scale(0.982802); }
        10% { transform: scale(0.977146); }
        12% { transform: scale(0.971948); }
        14% { transform: scale(0.967366); }
        16% { transform: scale(0.963455); }
        18% { transform: scale(0.960207); }
        20% { transform: scale(0.957573); }
        22% { transform: scale(0.955481); }
        24% { transform: scale(0.953856); }
        26% { transform: scale(0.952619); }
        28% { transform: scale(0.951698); }
        30% { transform: scale(0.951029); }
        32% { transform: scale(0.950556); }
        34% { transform: scale(0.950233); }
        36% { transform: scale(0.950022); }
        38% { transform: scale(0.950000); }
        40% { transform: scale(0.950000); }
        42% { transform: scale(0.950000); }
        44% { transform: scale(0.950000); }
        46% { transform: scale(0.950000); }
        48% { transform: scale(0.950000); }
        50% { transform: scale(0.950000); }
        52% { transform: scale(0.951764); }
        54% { transform: scale(0.955975); }
        56% { transform: scale(0.961396); }
        58% { transform: scale(0.967198); }
        60% { transform: scale(0.972854); }
        62% { transform: scale(0.978052); }
        64% { transform: scale(0.982634); }
        66% { transform: scale(0.986545); }
        68% { transform: scale(0.989793); }
        70% { transform: scale(0.992427); }
        72% { transform: scale(0.994519); }
        74% { transform: scale(0.996144); }
        76% { transform: scale(0.997381); }
        78% { transform: scale(0.998302); }
        80% { transform: scale(0.998971); }
        82% { transform: scale(0.999444); }
        84% { transform: scale(0.999767); }
        86% { transform: scale(0.999978); }
        88% { transform: scale(1.000000); }
        90% { transform: scale(1.000000); }
        92% { transform: scale(1.000000); }
        94% { transform: scale(1.000000); }
        96% { transform: scale(1.000000); }
        98% { transform: scale(1.000000); }
        100% { transform: scale(1.000000); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .selection-toolbar-bp-button-press { animation: selection-toolbar-bp-button-press 500ms linear 150ms both; }
        #stb-drawing .stb-selection { animation: stb-select 250ms ease-out both; }
        #stb-drawing .stb-popup { animation: stb-popup 400ms cubic-bezier(.16,1,.3,1) 250ms both; }
        #stb-drawing .stb-draw {
          stroke-dasharray: 1;
          animation: stb-draw-line 200ms ease-out var(--stb-delay, 250ms) both;
        }
        #stb-drawing .stb-outline { animation-duration: 400ms; animation-delay: 0ms; }
        #stb-drawing .stb-measure,
        #stb-drawing .stb-spacing,
        #stb-drawing .stb-label { animation: stb-reveal 200ms ease-out 700ms both; }
      }
    </style>
  </defs>
  <g id="stb-drawing">
    <rect width="1400" height="600" fill="#060606"/>

    <!-- Selection is context for the virtual anchor, not a second component. -->
    <rect x="505" y="388" width="390" height="60" rx="3" fill="#353632" class="stb-selection"/>
    <text x="514" y="430" fill="#c7c7c2" font-size="39" textLength="372" lengthAdjust="spacingAndGlyphs">copy or highlight it.</text>

    <g class="stb-popup">
    <!-- Popup outline: 334 x 32 CSS pixels, 8px outer corner radius. -->
    <rect x="200.5" y="269.5" width="999" height="93" rx="22.5" class="stb-ink stb-draw stb-outline" pathLength="1"/>

    <!-- Actual padding edges and individual action/group boundaries. -->
    <rect x="211" y="280" width="978" height="72" class="stb-spacing"/>
    <path d="M421 280V352 M448 280V352 M724 280V352 M730 280V352 M802 280V352 M808 280V352 M880 280V352 M886 280V352 M958 280V352 M985 280V352" class="stb-spacing"/>
    <rect x="241" y="295" width="42" height="42" class="stb-spacing"/>
    <rect x="307" y="292" width="84" height="48" class="stb-spacing"/>

    <!-- Copy: Lucide's 24-unit geometry scaled into its real 14px icon box. -->
    <g class="selection-toolbar-bp-button-press" style="transform-origin: 316px 316px">
      <g transform="translate(241 295) scale(1.75)" stroke="#a7a8a2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="14" height="14" rx="2" class="stb-draw" pathLength="1" style="--stb-delay:250ms"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" class="stb-draw" pathLength="1" style="--stb-delay:275ms"/>
      </g>
    </g>

    <g class="selection-toolbar-bp-button-press" style="transform-origin: 316px 316px">
      <text x="307" y="328" class="stb-action" textLength="84" lengthAdjust="spacingAndGlyphs">Copy</text>
    </g>


    <!-- A 1px divider, 16px high, with 2px horizontal margins. -->
    <path d="M434.5 292V340" class="stb-ink stb-draw" pathLength="1" style="--stb-delay:300ms;stroke-linecap:butt"/>

    <g class="selection-toolbar-bp-button-press" style="transform-origin: 586px 316px">
      <g transform="translate(478 295) scale(1.75)" stroke="#a7a8a2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 11-6 6v3h9l3-3" class="stb-draw" pathLength="1" style="--stb-delay:325ms"/>
        <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" class="stb-draw" pathLength="1" style="--stb-delay:350ms"/>
      </g>
    </g>

    <g class="selection-toolbar-bp-button-press" style="transform-origin: 586px 316px">
      <text x="544" y="328" class="stb-action" textLength="150" lengthAdjust="spacingAndGlyphs">Highlight</text>
    </g>


    <!-- Exclusive tone group. Selection fills the glyph, not the button background. -->
    <g class="selection-toolbar-bp-button-press" style="transform-origin: 766px 316px">
      <circle cx="766" cy="316" r="17.5" fill="#c7c7c2" stroke="#c7c7c2" stroke-width="3" class="stb-draw" pathLength="1" style="--stb-delay:375ms"/>
    </g>

    <g class="selection-toolbar-bp-button-press" style="transform-origin: 844px 316px">
      <circle cx="844" cy="316" r="17.5" class="stb-ink stb-draw" pathLength="1" style="--stb-delay:400ms"/>
    </g>

    <g class="selection-toolbar-bp-button-press" style="transform-origin: 922px 316px">
      <circle cx="922" cy="316" r="17.5" class="stb-ink stb-draw" pathLength="1" style="--stb-delay:425ms"/>
    </g>

    <path d="M971.5 292V340" class="stb-ink stb-draw" pathLength="1" style="--stb-delay:425ms;stroke-linecap:butt"/>

    <!-- Disabled Clear keeps the source's 50% opacity in every motion mode. -->
    <g opacity=".5">
      <g transform="translate(1009 295) scale(1.75)" stroke="#a7a8a2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" class="stb-draw" pathLength="1" style="--stb-delay:450ms"/>
        <path d="M22 21H7" class="stb-draw" pathLength="1" style="--stb-delay:450ms"/>
        <path d="m5 11 9 9" class="stb-draw" pathLength="1" style="--stb-delay:450ms"/>
      </g>
      <text x="1075" y="328" class="stb-action" textLength="84" lengthAdjust="spacingAndGlyphs">Clear</text>
    </g>

    </g>

    <!-- Chosen content-dependent width: endpoints are the actual popup box. -->
    <path d="M199 145V167 M1201 145V167 M199 156H1201" class="stb-measure"/>
    <path d="M199 179V252 M1201 179V252" class="stb-spacing"/>
    <text x="700" y="137" text-anchor="middle" class="stb-label">334 px</text>

    <!-- Fixed shell and action heights. -->
    <path d="M124 268H146 M124 364H146 M135 268V364" class="stb-measure"/>
    <path d="M153 268H183 M153 364H183" class="stb-spacing"/>
    <text x="112" y="322" text-anchor="end" class="stb-label">32 px</text>
    <path d="M1246 280H1268 M1246 352H1268 M1257 280V352" class="stb-measure"/>
    <path d="M1208 280H1238 M1208 352H1238" class="stb-spacing"/>
    <text x="1280" y="322" class="stb-label">24 px</text>

    <!-- Copy's horizontal inset, icon viewport, and icon-to-label gap. -->
    <path d="M211 219V241 M241 219V241 M211 230H241" class="stb-measure"/>
    <path d="M211 248V276 M241 248V291" class="stb-spacing"/>
    <path d="M226 230 204 204H160" class="stb-measure"/>
    <text x="147" y="210" text-anchor="end" class="stb-label">10 px</text>
    <path d="M241 187V209 M283 187V209 M241 198H283" class="stb-measure"/>
    <path d="M283 212V291" class="stb-spacing"/>
    <text x="262" y="180" text-anchor="middle" class="stb-label">14 px</text>
    <path d="M283 219V241 M307 219V241 M283 230H307" class="stb-measure"/>
    <path d="M307 248V288" class="stb-spacing"/>
    <path d="M295 230 323 204H365" class="stb-measure"/>
    <text x="378" y="210" class="stb-label">8 px</text>

    <!-- Icon-only action width and the actual 2px group gap. -->
    <path d="M730 219V241 M802 219V241 M730 230H802" class="stb-measure"/>
    <path d="M730 248V276 M802 248V276 M808 248V276" class="stb-spacing"/>
    <text x="766" y="211" text-anchor="middle" class="stb-label">24 px</text>
    <path d="M802 219V241 M808 219V241 M802 230H808" class="stb-measure"/>
    <path d="M805 230 834 204H871" class="stb-measure"/>
    <text x="884" y="210" class="stb-label">2 px</text>

    <!-- The shell has 4px padding, horizontally and vertically. -->
    <path d="M199 397V419 M211 397V419 M199 408H211" class="stb-measure"/>
    <path d="M199 370V393 M211 356V393" class="stb-spacing"/>
    <path d="M205 408 181 438H147" class="stb-measure"/>
    <text x="134" y="444" text-anchor="end" class="stb-label">4 px</text>
    <path d="M1214 352H1236 M1214 364H1236 M1225 352V364" class="stb-measure"/>
    <path d="M1225 358 1255 399H1278" class="stb-measure"/>
    <text x="1291" y="405" class="stb-label">4 px</text>

    <!-- Default sideOffset, measured from the popup to the selected range. -->
    <path d="M917 364H939 M917 388H939 M928 364V388" class="stb-measure"/>
    <path d="M899 388H911" class="stb-spacing"/>
    <path d="M928 376H977" class="stb-measure"/>
    <text x="990" y="382" class="stb-label">8 px</text>
  </g>
</svg>
