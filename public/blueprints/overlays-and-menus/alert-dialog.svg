<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" fill="none" role="img" aria-labelledby="adbp-title adbp-description">
  <title id="adbp-title">Alert Dialog spacing blueprint</title>
  <desc id="adbp-description">The dialog enters once with the same spring scale, fade, and blur as Dialog. An open destructive confirmation dialog with a warning triangle before the title Delete this project?, a one-line deletion warning, Cancel, and Delete. The illustrated dialog is 512 pixels wide and 150 pixels tall, with 24 pixels of padding inside its 1 pixel border. The warning icon is 20 pixels wide with an 8 pixel gap before the title. The title and description have a 6 pixel gap; the header and footer have a 16 pixel gap. The default-sized buttons are 34 pixels high and 8 pixels apart. Blue dashed guides show the content bounds and line boxes.</desc>
  <!--
    Hand-authored vector drawing. Source measurements:
      registry/ui/alert-dialog/alert-dialog.tsx
      registry/ui/button/button.variants.ts (default md, outline Cancel, destructive Delete)
      inspector/entries/alert-dialog.tsx (header/footer composition; destructive state)
      app/globals.css (type, radii, and dark background tokens)
      node_modules/tailwindcss/theme.css and preflight.css (spacing and border-box)
    Alert Dialog has no sibling variants file; its styles are in its implementation.

    State: open, desktop viewport at least 640px wide; no hover or press.
    Uses the default button size and the demo's destructive action and copy.
    User-requested composition: a 20px warning triangle and an 8px gap before
    the title. These are illustration choices, not built-in component defaults.
    The icon fits within the existing 24px title line without changing its height.
    Width is flexible: min(viewport - 32px, 512px). This drawing CHOOSES the
    configured maximum, 512px, on a sufficiently wide viewport; it is not fixed.
    One description line is valid within the 462px content width.

    Geometry in CSS px, drawn at a consistent 2x scale:
      spacing token = 4px; max-w-lg = 32rem = 512px, assuming 16px root font.
      border = 1px; p-6 = 24px; rounded-md = 7px.
      content width = 512 - 2(1 + 24) = 462px.
      title: text-base = 15px, line-height 1.6 = 24px, semibold.
      description and buttons: text-sm = 13px, line-height 1.5385 ~= 20px.
      header = 24 + 6 (gap-1.5) + 20 = 50px.
      content gap-4 = 16px; desktop footer is right-aligned, gap-2 = 8px.
      default md buttons: fixed 34px high, px-3.5 = 14px, radius 8px.
      content-dependent height = 2(1 + 24) + 50 + 16 + 34 = 150px.
      The tiny line-height token rounding is below displayed-pixel precision.

    SVG outer bounds: x208..1232, y210..510. Stroke center is inset 1 unit,
    so the 2-unit stroke represents the actual 1 CSS px border without adding size.
    Inner border edges: x210/1230, y212/508. Padding edges: x258/1182, y260/460.
    Title line box y260..308; description y320..360; footer y392..460.
    Intrinsic button widths vary with the font. Representative label advances in
    the illustration's Segoe UI fallback at 26 units: Cancel 75.94, Delete 74.13.
    Each adds 56 units of horizontal padding; no fixed button width is implied.
    Cancel x903.93..1035.87; 16-unit gap; Delete x1051.87..1182.
    Warning icon slot x258..298, y264..304; title begins at x314 after a 16-unit gap.

    Background: .dark background token oklch(0.120 0 0), rounded to #060606.
    Illustration inks intentionally simplify the production surface colors.
    Native entrance: alert-dialog.tsx uses Dialog's opacity 0, scale .96, blur 4px
    pose and registry/lib/motion.ts spring.smooth (visualDuration .3, bounce .1).
    At 2x, blur is 8 units; center is (720, 360). Installed Motion's spring is
    sampled every 10ms, freezing at rest; the entrance runs 50..600ms.
    Animation: outer 0..400ms; warning strokes 250..450ms, 275..475ms, 300..500ms;
    button strokes 400..600ms and 425..625ms;
    every blue annotation 700..900ms. Static and reduced-motion states are complete.
  -->
  <defs>
    <style>
      #adbp-root text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      #adbp-root .adbp-title-text { fill: #c7c7c2; font-size: 30px; font-weight: 600; }
      #adbp-root .adbp-description-text { fill: #92948d; font-size: 26px; }
      #adbp-root .adbp-button-text { fill: #c7c7c2; font-size: 26px; font-weight: 500; }
      #adbp-root .adbp-label { fill: #a1a29c; font-size: 18px; }
      #adbp-root .adbp-measure { stroke: #6889ff; stroke-width: 1.5; }
      #adbp-root .adbp-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      #adbp-root .adbp-outline { stroke: #a7a8a2; stroke-width: 2; }
      #adbp-root .adbp-detail { stroke: #a7a8a2; stroke-width: 2.5; }
      #adbp-root .adbp-warning { stroke: #a7a8a2; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes adbp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes adbp-reveal { from { opacity: 0; } }
      /* One press/release during reveal, matching Button's .95 press scale.
         spring.press: stiffness 500, damping 30, mass .6; sampled every 10ms.
         Runs 150..650ms, before measurements appear at 700ms. Separate groups
         compose with content/panel motion; static and reduced motion stay at 1. */
      @keyframes alert-dialog-bp-button-press {
        0% { transform: scale(1.000000); }
        2% { transform: scale(0.998236); }
        4% { transform: scale(0.994025); }
        6% { transform: scale(0.988604); }
        8% { transform: scale(0.982802); }
        10% { transform: scale(0.977146); }
        12% { transform: scale(0.971948); }
        14% { transform: scale(0.967366); }
        16% { transform: scale(0.963455); }
        18% { transform: scale(0.960207); }
        20% { transform: scale(0.957573); }
        22% { transform: scale(0.955481); }
        24% { transform: scale(0.953856); }
        26% { transform: scale(0.952619); }
        28% { transform: scale(0.951698); }
        30% { transform: scale(0.951029); }
        32% { transform: scale(0.950556); }
        34% { transform: scale(0.950233); }
        36% { transform: scale(0.950022); }
        38% { transform: scale(0.950000); }
        40% { transform: scale(0.950000); }
        42% { transform: scale(0.950000); }
        44% { transform: scale(0.950000); }
        46% { transform: scale(0.950000); }
        48% { transform: scale(0.950000); }
        50% { transform: scale(0.950000); }
        52% { transform: scale(0.951764); }
        54% { transform: scale(0.955975); }
        56% { transform: scale(0.961396); }
        58% { transform: scale(0.967198); }
        60% { transform: scale(0.972854); }
        62% { transform: scale(0.978052); }
        64% { transform: scale(0.982634); }
        66% { transform: scale(0.986545); }
        68% { transform: scale(0.989793); }
        70% { transform: scale(0.992427); }
        72% { transform: scale(0.994519); }
        74% { transform: scale(0.996144); }
        76% { transform: scale(0.997381); }
        78% { transform: scale(0.998302); }
        80% { transform: scale(0.998971); }
        82% { transform: scale(0.999444); }
        84% { transform: scale(0.999767); }
        86% { transform: scale(0.999978); }
        88% { transform: scale(1.000000); }
        90% { transform: scale(1.000000); }
        92% { transform: scale(1.000000); }
        94% { transform: scale(1.000000); }
        96% { transform: scale(1.000000); }
        98% { transform: scale(1.000000); }
        100% { transform: scale(1.000000); }
      }
      #adbp-root .adbp-enter { transform-origin: 720px 360px; }
      @keyframes adbp-enter {
        0.0000% { opacity: 0.000000; transform: scale(0.960000); filter: blur(8.000000px); }
        1.8182% { opacity: 0.013720; transform: scale(0.960549); filter: blur(7.890244px); }
        3.6364% { opacity: 0.049457; transform: scale(0.961978); filter: blur(7.604341px); }
        5.4545% { opacity: 0.100345; transform: scale(0.964014); filter: blur(7.197237px); }
        7.2727% { opacity: 0.160972; transform: scale(0.966439); filter: blur(6.712220px); }
        9.0909% { opacity: 0.227132; transform: scale(0.969085); filter: blur(6.182944px); }
        10.9091% { opacity: 0.295607; transform: scale(0.971824); filter: blur(5.635140px); }
        12.7273% { opacity: 0.363989; transform: scale(0.974560); filter: blur(5.088089px); }
        14.5455% { opacity: 0.430519; transform: scale(0.977221); filter: blur(4.555850px); }
        16.3636% { opacity: 0.493961; transform: scale(0.979758); filter: blur(4.048309px); }
        18.1818% { opacity: 0.553495; transform: scale(0.982140); filter: blur(3.572042px); }
        20.0000% { opacity: 0.608621; transform: scale(0.984345); filter: blur(3.131034px); }
        21.8182% { opacity: 0.659090; transform: scale(0.986364); filter: blur(2.727281px); }
        23.6364% { opacity: 0.704842; transform: scale(0.988194); filter: blur(2.361265px); }
        25.4545% { opacity: 0.745955; transform: scale(0.989838); filter: blur(2.032357px); }
        27.2727% { opacity: 0.782609; transform: scale(0.991304); filter: blur(1.739128px); }
        29.0909% { opacity: 0.815049; transform: scale(0.992602); filter: blur(1.479606px); }
        30.9091% { opacity: 0.843566; transform: scale(0.993743); filter: blur(1.251470px); }
        32.7273% { opacity: 0.868474; transform: scale(0.994739); filter: blur(1.052207px); }
        34.5455% { opacity: 0.890096; transform: scale(0.995604); filter: blur(0.879229px); }
        36.3636% { opacity: 0.908755; transform: scale(0.996350); filter: blur(0.729960px); }
        38.1818% { opacity: 0.924763; transform: scale(0.996991); filter: blur(0.601899px); }
        40.0000% { opacity: 0.938416; transform: scale(0.997537); filter: blur(0.492670px); }
        41.8182% { opacity: 0.949995; transform: scale(0.998000); filter: blur(0.400042px); }
        43.6364% { opacity: 0.959756; transform: scale(0.998390); filter: blur(0.321955px); }
        45.4545% { opacity: 0.967934; transform: scale(0.998717); filter: blur(0.256525px); }
        47.2727% { opacity: 0.974744; transform: scale(0.998990); filter: blur(0.202046px); }
        49.0909% { opacity: 0.980377; transform: scale(0.999215); filter: blur(0.156987px); }
        50.9091% { opacity: 0.985002; transform: scale(0.999400); filter: blur(0.119981px); }
        52.7273% { opacity: 0.988772; transform: scale(0.999551); filter: blur(0.089824px); }
        54.5455% { opacity: 0.991818; transform: scale(0.999673); filter: blur(0.065455px); }
        56.3636% { opacity: 0.994256; transform: scale(0.999770); filter: blur(0.045949px); }
        58.1818% { opacity: 0.996187; transform: scale(0.999847); filter: blur(0.030504px); }
        60.0000% { opacity: 0.997697; transform: scale(0.999908); filter: blur(0.018427px); }
        61.8182% { opacity: 0.998859; transform: scale(0.999954); filter: blur(0.009126px); }
        63.6364% { opacity: 0.999738; transform: scale(0.999990); filter: blur(0.002094px); }
        65.4545% { opacity: 1.000000; transform: scale(1.000015); filter: blur(0.000000px); }
        67.2727% { opacity: 1.000000; transform: scale(1.000034); filter: blur(0.000000px); }
        69.0909% { opacity: 1.000000; transform: scale(1.000047); filter: blur(0.000000px); }
        70.9091% { opacity: 1.000000; transform: scale(1.000055); filter: blur(0.000000px); }
        72.7273% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        74.5455% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        76.3636% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        78.1818% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        80.0000% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        81.8182% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        83.6364% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        85.4545% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        87.2727% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        89.0909% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        90.9091% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        92.7273% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        94.5455% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        96.3636% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        98.1818% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
        100.0000% { opacity: 1.000000; transform: scale(1.000000); filter: blur(0.000000px); }
      }
      @media (prefers-reduced-motion: no-preference) {
        #adbp-root .adbp-enter { animation: adbp-enter 550ms linear 50ms both; }
        .alert-dialog-bp-button-press { animation: alert-dialog-bp-button-press 500ms linear 150ms both; }
        #adbp-root .adbp-draw {
          stroke-dasharray: 1;
          animation: adbp-draw 200ms ease-out var(--adbp-delay, 0ms) both;
        }
        #adbp-root .adbp-outline { animation-duration: 400ms; }
        #adbp-root .adbp-measure,
        #adbp-root .adbp-spacing,
        #adbp-root .adbp-label {
          animation: adbp-reveal 200ms ease-out 700ms both;
        }
      }
    </style>
  </defs>
  <g id="adbp-root">
    <rect width="1440" height="720" fill="#060606"/>

    <g class="adbp-enter">
      <!-- The complete dialog enters as one surface; button presses compose inside. -->
      <g class="alert-dialog-bp-button-press" style="transform-origin: 1116.935px 426px">
        <rect x="1051.87" y="392" width="130.13" height="68" rx="16" fill="#353632"/>
      </g>

      <rect x="209" y="211" width="1022" height="298" rx="13" pathLength="1" class="adbp-outline adbp-draw"/>
      <g class="alert-dialog-bp-button-press" style="transform-origin: 969.9px 426px">
        <rect x="903.93" y="392" width="131.94" height="68" rx="16" pathLength="1" class="adbp-detail adbp-draw" style="--adbp-delay:400ms"/>
      </g>

      <g class="alert-dialog-bp-button-press" style="transform-origin: 1116.935px 426px">
        <rect x="1051.87" y="392" width="130.13" height="68" rx="16" pathLength="1" class="adbp-detail adbp-draw" style="--adbp-delay:425ms"/>
      </g>

      <!-- Padding boundary and actual title/description line boxes; overlays sit above fills. -->
      <rect x="258" y="260" width="924" height="200" class="adbp-spacing"/>
      <path d="M258 308H1182 M258 320H1182 M258 360H1182 M258 392H1182" class="adbp-spacing"/>
      <path d="M1035.87 392V460 M1051.87 392V460" class="adbp-spacing"/>
      <rect x="258" y="264" width="40" height="40" class="adbp-spacing"/>
      <path d="M298 260V308 M314 260V308" class="adbp-spacing"/>

      <!-- Separate normalized strokes keep the triangle and exclamation readable as they draw. -->
      <path d="M278 267 296 300H260Z" fill="#060606" pathLength="1" class="adbp-warning adbp-draw" style="--adbp-delay:250ms"/>
      <path d="M278 279V287" pathLength="1" class="adbp-warning adbp-draw" style="--adbp-delay:275ms"/>
      <circle cx="278" cy="294" r="1" pathLength="1" class="adbp-warning adbp-draw" style="--adbp-delay:300ms"/>
      <text x="314" y="295" class="adbp-title-text">Delete this project?</text>
      <text x="258" y="349" class="adbp-description-text">This permanently deletes the project and its contents.</text>
      <g class="alert-dialog-bp-button-press" style="transform-origin: 969.9px 426px">
        <text x="969.9" y="435" text-anchor="middle" class="adbp-button-text">Cancel</text>
      </g>

      <g class="alert-dialog-bp-button-press" style="transform-origin: 1116.935px 426px">
        <text x="1116.935" y="435" text-anchor="middle" class="adbp-button-text">Delete</text>
      </g>
    </g>

    <!-- Current width, explicitly drawn at the chosen maximum. -->
    <path d="M208 194V136 M1232 194V136 M208 146H1232 M208 136V156 M1232 136V156" class="adbp-measure"/>
    <text x="720" y="126" text-anchor="middle" class="adbp-label">512 px</text>

    <!-- Content-dependent total height, for the pictured single-line description. -->
    <path d="M192 210H124 M192 510H124 M136 210V510 M126 210H146 M126 510H146" class="adbp-measure"/>
    <text x="112" y="366" text-anchor="end" class="adbp-label">150 px</text>

    <!-- Top padding measures from the INSIDE of the border to the first line box. -->
    <path d="M800 212V260 M790 212H810 M790 260H810" class="adbp-measure"/>
    <text x="824" y="242" class="adbp-label">24 px</text>

    <!-- Caller-chosen warning-icon to title gap. -->
    <path d="M298 244V256 M314 244V256 M298 250H314 M306 244 334 230H350" class="adbp-measure"/>
    <text x="362" y="236" class="adbp-label">8 px</text>

    <!-- Right column: title/description gap, header/footer gap, and button height. -->
    <path d="M1196 308H1286 M1196 320H1286 M1276 308V320 M1266 308H1286 M1266 320H1286" class="adbp-measure"/>
    <text x="1300" y="320" class="adbp-label">6 px</text>
    <path d="M1196 360H1286 M1196 392H1286 M1276 360V392 M1266 360H1286 M1266 392H1286" class="adbp-measure"/>
    <text x="1300" y="382" class="adbp-label">16 px</text>
    <path d="M1276 392V460 M1196 460H1286 M1266 460H1286" class="adbp-measure"/>
    <text x="1300" y="432" class="adbp-label">34 px</text>

    <!-- Horizontal padding also excludes the 1px border. -->
    <path d="M210 526V566 M258 476V566 M210 550H258 M210 540V560 M258 540V560 M234 560 208 590H178" class="adbp-measure"/>
    <text x="166" y="596" text-anchor="end" class="adbp-label">24 px</text>

    <!-- The 8px gap is between the button boxes, not between their text labels. -->
    <path d="M1035.87 476V562 M1051.87 476V562 M1035.87 550H1051.87 M1035.87 540V560 M1051.87 540V560 M1043.87 562 1069.78 590H1080" class="adbp-measure"/>
    <text x="1092" y="596" class="adbp-label">8 px</text>
  </g>
</svg>
