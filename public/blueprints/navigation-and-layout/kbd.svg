<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" fill="none" role="img" aria-labelledby="kbd-bp-title kbd-bp-desc">
  <title id="kbd-bp-title">Command, Shift, K spacing blueprint</title>
  <desc id="kbd-bp-desc">A Command icon, Shift, and K in separate small keycaps. The group has 4 pixel gaps. Keycaps have 4 pixel horizontal and 2 pixel vertical padding. The default 11 pixel Command icon produces a 19 by 15 pixel keycap, centered beside the 16 pixel tall text keycaps.</desc>
  <!-- Sources: registry/ui/kbd/kbd.tsx, kbd.variants.ts; inspector/entries/kbd.tsx;
       app/globals.css; node_modules/tailwindcss/theme.css; installed lucide-react Command.
       Sidebar: COMPONENT_CATEGORIES in lib/component-catalog.ts.
       State: manually composed KbdGroup, default sm size, Command SVG / Shift / K.
       Scale: 5 SVG units per CSS pixel. No production border.
       rem=16px; spacing=4px; gap-1=4px; px-1=4px; py-0.5=2px.
       Default SVG size is 1em=11px. Icon-only flex content has no text line box:
       Command width=11+8=19px; height=11+4=15px.
       Group items-center centers the icon cap beside the 16px text caps.
       text-2xs=11px; tracking=.22px; line height=11*1.0909=11.9999px, drawn as 12px.
       Text cap height=12+4=16px, content-dependent, not fixed.
       Local Geist Mono metrics: .next/static/media/797e433ab948586e-s.p.0r6juujl39pe6.woff2;
       unitsPerEm=1000; Shift/K advances=600. Character advance=11*.6+.22=6.82px.
       Shift width=5*6.82+8=42.1px. K width=max(16,6.82+8)=16px.
       Group width=19+4+42.1+4+16=85.1px, before browser subpixel quantization.
       rounded-xs=3px, drawn as 15 units; illustrative outlines are inset.
       Text uses the required sans-serif illustration face at 55 units.
       Dashed lines mark CSS content boxes, not glyph ink bounds.
       Background oklch(.100 0 0) rounds to sRGB #030303.
  -->
  <defs>
    <style>
      #kbd-bp-root text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .kbd-bp-key { fill: #92948d; font-size: 55px; letter-spacing: 1.1px; }
      .kbd-bp-label { fill: #6889ff; font-size: 18px; }
      .kbd-bp-measure { stroke: #6889ff; stroke-width: 1.5; }
      .kbd-bp-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      @keyframes kbd-bp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes kbd-bp-reveal { from { opacity: 0; } }
      /* Static and reduced-motion viewers see the completed drawing.
         Outlines and Command 0–400ms, annotations 700–900ms.
         Command shares the outline timing so it does not start late and rush. */
      @media (prefers-reduced-motion: no-preference) {
        .kbd-bp-outline, .kbd-bp-icon { stroke-dasharray: 1; animation: kbd-bp-draw 400ms ease-out both; }
        .kbd-bp-measure, .kbd-bp-spacing, .kbd-bp-label { animation: kbd-bp-reveal 200ms ease-out 700ms both; }
      }
    </style>
  </defs>
  <g id="kbd-bp-root">
    <rect width="900" height="440" fill="#030303"/>
    <rect x="240" y="182.5" width="95" height="75" rx="15" fill="#353632"/>
    <rect x="355" y="180" width="210.5" height="80" rx="15" fill="#353632"/>
    <rect x="585.5" y="180" width="80" height="80" rx="15" fill="#353632"/>
    <rect x="241" y="183.5" width="93" height="73" rx="14" stroke="#a7a8a2" stroke-width="2" pathLength="1" class="kbd-bp-outline"/>
    <rect x="356" y="181" width="208.5" height="78" rx="14" stroke="#a7a8a2" stroke-width="2" pathLength="1" class="kbd-bp-outline"/>
    <rect x="586.5" y="181" width="78" height="78" rx="14" stroke="#a7a8a2" stroke-width="2" pathLength="1" class="kbd-bp-outline"/>

    <path d="M260 182.5V257.5 M315 182.5V257.5 M240 192.5H335 M240 247.5H335
             M375 180V260 M545.5 180V260 M355 190H565.5 M355 250H565.5
             M605.5 180V260 M645.5 180V260 M585.5 190H665.5 M585.5 250H665.5" class="kbd-bp-spacing"/>
    <!-- Exact installed Lucide Command geometry, with illustration stroke weight.
         Its SVG viewport is 11px square, drawn as 55 units. -->
    <g transform="translate(260 192.5) scale(2.2916666667)" stroke="#92948d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" pathLength="1" class="kbd-bp-icon"/>
    </g>
    <text x="460.25" y="240" text-anchor="middle" class="kbd-bp-key">Shift</text>
    <text x="625.5" y="240" text-anchor="middle" class="kbd-bp-key">K</text>

    <!-- Icon-only cap height. -->
    <path d="M234 182.5H184 M234 257.5H184" class="kbd-bp-spacing"/>
    <path d="M180 182.5H200 M180 257.5H200 M190 182.5V257.5" class="kbd-bp-measure"/>
    <text x="170" y="226" text-anchor="end" class="kbd-bp-label">15 px</text>

    <!-- Gap endpoints are the actual outer edges, despite differing cap heights. -->
    <path d="M335 176.5V116 M355 174V116" class="kbd-bp-spacing"/>
    <path d="M335 110V130 M355 110V130 M335 120H355" class="kbd-bp-measure"/>
    <text x="345" y="100" text-anchor="middle" class="kbd-bp-label">4 px</text>

    <path d="M585.5 174V116 M665.5 174V116" class="kbd-bp-spacing"/>
    <path d="M585.5 110V130 M665.5 110V130 M585.5 120H665.5" class="kbd-bp-measure"/>
    <text x="625.5" y="100" text-anchor="middle" class="kbd-bp-label">16 px</text>

    <!-- Horizontal padding of the Command cap. -->
    <path d="M240 263.5V314 M260 263.5V314" class="kbd-bp-spacing"/>
    <path d="M240 300V320 M260 300V320 M240 310H260" class="kbd-bp-measure"/>
    <text x="250" y="347" text-anchor="middle" class="kbd-bp-label">4 px</text>

    <!-- Bottom padding on Shift. -->
    <path d="M565.5 250H576 M565.5 260H576" class="kbd-bp-spacing"/>
    <path d="M570 250H582 M570 260H582 M576 250V260 M576 260V310H516" class="kbd-bp-measure"/>
    <text x="502" y="316" text-anchor="end" class="kbd-bp-label">2 px</text>

    <!-- Text line height. -->
    <path d="M671.5 190H709 M671.5 250H709" class="kbd-bp-spacing"/>
    <path d="M699 190H719 M699 250H719 M709 190V250" class="kbd-bp-measure"/>
    <text x="731" y="226" class="kbd-bp-label">12 px</text>
  </g>
</svg>
