<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" fill="none" role="img" aria-labelledby="progress-bp-title progress-bp-desc">
  <title id="progress-bp-title">Progress spacing blueprint</title>
  <desc id="progress-bp-desc">The default upload progress demo at 60 percent, drawn at twice its CSS size. The chosen width is 384 pixels, the label line is approximately 20 pixels high, the label-to-track gap is 8 pixels, and the track is 8 pixels high.</desc>
  <!-- Sources: registry/ui/progress/progress.tsx; inspector/entries/progress.tsx;
       app/globals.css; node_modules/tailwindcss/theme.css; lib/component-catalog.ts.
       No variants sibling: Progress has one default track treatment.
       LTR, value=60, min=0, max=100; demo showValue=true, shimmer=false.
       Representative caller width chosen at demo max-w-sm: 24rem = 384px.
       Scale 2x. rem=16px; spacing=.25rem=4px; h-2=8px; space-y-2=8px.
       text-sm=13px; line-height=1.5385 yields 20.0005px, rounded here to 20px.
       Demo total height = 20 + 8 + 8 = 36px. No borders or padding.
       Track x=156..924, y=206..222. Label line box y=150..190.
       Indicator is full width, translated -40% and clipped by the track:
       visible width = 384*.6 = 230.4px (460.8 drawing units).
       Reveal: 0 to 60% in 700ms with cubic ease-out, then guides complete at 900ms.
       Fill and leading edge share translateX(-460.8px) to zero.
       Percentage frames use inverse cubic times: t=700*(1-cbrt(1-value/60)).
       Static exports and reduced motion show only the completed 60% state.
       Outlines are illustration strokes, not production borders.
       Dark background token oklch(.120 0 0) resolves to #060606. -->
  <defs>
    <clipPath id="progress-bp-track-clip"><rect x="156" y="206" width="768" height="16" rx="8"/></clipPath>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .progress-bp-text { fill: #92948d; font-size: 26px; }
      .progress-bp-label { fill: #6889ff; font-size: 18px; }
      .progress-bp-measure { stroke: #6889ff; stroke-width: 1.5; }
      .progress-bp-spacing { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      @keyframes progress-bp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes progress-bp-reveal { from { opacity: 0; } }
      .progress-bp-count-frame { opacity: 0; }
      @keyframes progress-bp-fill { from { transform: translateX(-460.8px); } to { transform: translateX(0); } }
      @keyframes progress-bp-count { from { opacity: 1; } to { opacity: 0; } }
      @keyframes progress-bp-final { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: no-preference) {
        .progress-bp-fill { animation: progress-bp-fill 700ms cubic-bezier(.333333,1,.666667,1) both; }
        .progress-bp-count-frame { animation: progress-bp-count var(--frame-duration) steps(1, end) var(--frame-delay); }
        .progress-bp-count-final { animation: progress-bp-final 700ms steps(1, end) both; }
        .progress-bp-draw { stroke-dasharray: 1; animation: progress-bp-draw 400ms ease-out both; }
        .progress-bp-detail { animation-duration: 200ms; animation-delay: 400ms; }
        .progress-bp-measure, .progress-bp-spacing, .progress-bp-label { animation: progress-bp-reveal 200ms ease-out 700ms both; }
      }
    </style>
  </defs>
  <rect width="1080" height="360" fill="#060606"/>
  <g clip-path="url(#progress-bp-track-clip)">
    <rect x="-151.2" y="206" width="768" height="16" rx="8" fill="#353632" class="progress-bp-fill"/>
  </g>
  <rect x="156" y="206" width="768" height="16" rx="8" stroke="#a7a8a2" stroke-width="2" pathLength="1" class="progress-bp-draw"/>
  <g clip-path="url(#progress-bp-track-clip)"><g class="progress-bp-fill"><path d="M608.8 206a8 8 0 0 1 0 16" stroke="#a7a8a2" stroke-width="2" pathLength="1" class="progress-bp-draw progress-bp-detail"/></g></g>
  <!-- Line boxes and aligned content edges, over surfaces but behind text. -->
  <path d="M156 150H924 M156 190H924 M156 126V239 M924 126V239 M616.8 222V278" class="progress-bp-spacing"/>
  <text x="156" y="179" class="progress-bp-text">Uploading…</text>
