  <!-- Chosen paragraph width, not the max-width token or the text advance. -->
  <path d="M180 150V93 M820 150V93" class="blur-text-bp-guide"/>
  <path d="M180 89V111 M180 100H820 M820 89V111" class="blur-text-bp-ruler"/>
  <text x="500" y="80" text-anchor="middle" class="blur-text-bp-label">320 px</text>

