<svg xmlns="http://www.w3.org/2000/svg" id="blur-text-bp" width="1000" height="560" viewBox="0 0 1000 560" fill="none" role="img" aria-labelledby="blur-text-bp-title blur-text-bp-desc">
  <title id="blur-text-bp-title">Blur Text spacing</title>
  <desc id="blur-text-bp-desc">Minimal React components built on Base UI. The default character reveal, drawn at twice CSS size in a representative 320 pixel wide paragraph. Three 40 pixel lines make a 120 pixel tall text block, with zero padding. Letters sharpen and rise into place in sequence, followed by the measurement guides. Reduced motion shows the completed drawing immediately.</desc>
  <!-- Sources: registry/ui/blur-text/blur-text.tsx (the only registry item file);
       inspector/entries/blur-text.tsx; content/docs/blur-text.mdx;
       app/globals.css; node_modules/tailwindcss/theme.css;
       lib/component-catalog.ts: COMPONENT_CATEGORIES, Feedback and status.
       No sibling variants file exists.

       Default by="character", delay=0, automatic stagger; full default demo label.
       The caller supplies as="p", text-3xl, font-semibold, tracking-[-0.03em],
       text-center, text-balance, max-w-md. The component has no intrinsic size,
       padding, surface, border, or solid strokes to draw.
       Chosen paragraph width: 320 CSS px, within max-w-md = 28rem = 448px.
       This is a representative three-line wrap, not a fixed component width.
       Text size: 2.25rem = 36px; line-height: 36 * 1.1111 = 39.9996px,
       rounded to 40px. Block height: 3 * 40 = 120px. Padding and line gap: 0.
       Scale 2x: block (180,160)-(820,400), width 640, height 240, line height 80.
       Guides measure line boxes, not glyph ink or the empty space from centering.
       Illustration font: approved sans-serif stack, local Segoe UI Semibold fallback.
       Individual advances measured at 36px via System.Drawing GenericTypographic;
       textLength preserves those advances across local sans-serif fallbacks.
       Each segment advance includes -0.03em = -1.08px tracking, as in the demo.
       Baseline from font metrics (em=2048, ascent=2210, descent=514):
       (40 - (2210+514)*36/2048)/2 + 2210*36/2048 = 34.90625px.
       Paragraph line breaks are drawn explicitly; words remain intact.
       Dark background: oklch(0.120 0 0) resolves to #060606.

       Signature motion: 36 non-space characters, 300/(36-1) = 8.571429ms
       stagger, first start 0ms, last start 300ms; each takes duration-slow=300ms.
       Source blur 0.22em = 7.92px, rise 0.45em = 16.2px; at 2x, 15.84 and 32.4.
       The blueprint retains 25% initial opacity to keep text visible throughout.
       Blur and rise otherwise follow the source's CSS ease-out entrance.
       All letters settle by 600ms; guides and labels fade together at 700..900ms.
       CSS-only, one pass. Backwards fill holds each starting pose through its
       delay, then drops the filter at rest. Static/reduced-motion is fully visible.
  -->
  <defs>
    <style>
      #blur-text-bp text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      #blur-text-bp .blur-text-bp-letter { fill: #c7c7c2; font-size: 72px; font-weight: 600; }
      #blur-text-bp .blur-text-bp-label { fill: #a1a29c; font-size: 18px; }
      #blur-text-bp .blur-text-bp-ruler { stroke: #6889ff; stroke-width: 1.5; }
      #blur-text-bp .blur-text-bp-guide { stroke: #6889ff; stroke-width: 1.5; stroke-dasharray: 6 7; opacity: .55; }
      @keyframes blur-text-bp-enter {
        from { opacity: .25; filter: blur(15.84px); transform: translateY(32.4px); }
        to { opacity: 1; filter: blur(0px); transform: translateY(0px); }
      }
      @keyframes blur-text-bp-annotate { from { opacity: 0; } }
      @media (prefers-reduced-motion: no-preference) {
        #blur-text-bp .blur-text-bp-letter {
          animation: blur-text-bp-enter 300ms ease-out var(--blur-text-bp-delay, 0ms) backwards;
        }
        #blur-text-bp .blur-text-bp-ruler,
        #blur-text-bp .blur-text-bp-guide,
        #blur-text-bp .blur-text-bp-label {
          animation: blur-text-bp-annotate 200ms ease-out 700ms both;
        }
      }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#060606"/>

  <!-- The paragraph has no frame: only its actual line-box edges are dashed. -->
  <rect x="180" y="160" width="640" height="240" class="blur-text-bp-guide"/>
  <path d="M180 240H820 M180 320H820" class="blur-text-bp-guide"/>

